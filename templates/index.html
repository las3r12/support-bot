<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Domains</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-layout">
  {% include 'header.html' %}

  <div class="main-content centered">

    <h1>Domains</h1>

    <div class="domain-list">
      {% if domains %}
        {% for domain in domains %}
        <div class="domain-card">
          <div class="domain-card-header">
            <div class="domain-info">
              <span class="domain-icon">🌐</span>
              <span class="domain-name">{{ domain.domain }}</span>
            </div>
            <button class="edit-toggle" onclick="window.location.href='/edit/{{ domain.token }}'">
              ✏ Edit
            </button>
          </div>
        </div>
        {% endfor %}
      {% else %}
        <div class="empty-state">No domains yet — create one below.</div>
      {% endif %}
    </div>

    <div class="divider">New Domain</div>

    <form class="create-form" method="POST" action="/create">
      <input
        class="create-input"
        type="text"
        name="domain"
        id="domainInput"
        placeholder="example.com"
      />
      <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
      <button class="btn-create" type="submit">+ Create</button>
    </form>
    
</body>
</html>
