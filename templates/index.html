<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Domains</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-layout">
  {% include 'header.html' %}

  <div class="main-content centered">

    <h1>Domains</h1>

    <div class="domain-list">
      {% if domains %}
        {% for domain in domains %}
        <div class="domain-card">
          <div class="domain-card-header">
            <div class="domain-info">
              <span class="domain-icon">🌐</span>
              <span class="domain-name">{{ domain.domain }}</span>
            </div>
            <button class="edit-toggle" onclick="window.location.href='/edit/{{ domain.token }}'">
              ✏ Edit
            </button>
          </div>
        </div>
        {% endfor %}
      {% else %}
        <div class="empty-state">No domains yet — create one below.</div>
      {% endif %}
    </div>

    <div class="divider">New Domain</div>

    <form id="create-form" class="create-form" method="POST" action="/create">
      <input
        class="create-input"
        type="text"
        name="domain"
        id="domainInput"
        placeholder="example.com"
      />
      <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
      <button class="btn-create" type="submit">+ Create</button>
    </form>
    <p id="create-error" style="color: red; font-size: 0.9rem; margin: 0; display: none;"></p>
    <script>
      document.getElementById('create-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const res = await fetch('/create', {
          method: 'POST',
          body: new FormData(form),
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json();
          const err = document.getElementById('create-error');
          err.textContent = data.error;
          err.style.display = 'block';
        }
      });
    </script>
</body>
</html>
