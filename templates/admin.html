<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin — Users</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .admin-table th {
      text-align: left;
      padding: 0.85rem 1.2rem;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #6b7280;
      border-bottom: 1px solid var(--border, #e5e7eb);
      background: #f9fafb;
    }
    .admin-table td {
      padding: 0.85rem 1.2rem;
      border-bottom: 1px solid var(--border, #e5e7eb);
      font-size: 0.95rem;
      color: #111827;
    }
    .admin-table tr:last-child td { border-bottom: none; }
    .credits-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .credits-input {
      width: 90px;
      padding: 0.35rem 0.6rem;
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .credits-input:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 0 2px rgba(34,197,94,0.15);
    }
    .btn-save {
      padding: 0.35rem 0.8rem;
      background: #22c55e;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .btn-save:hover { background: #16a34a; }
    .save-status {
      font-size: 0.8rem;
      color: #16a34a;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .save-status.visible { opacity: 1; }
    .save-status.error { color: #dc2626; }
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #6b7280;
    }
  </style>
</head>
<body class="app-layout">
  {% include 'header.html' %}

  <div class="main-content centered">
    <h1>Users</h1>

    {% if users %}
    <table class="admin-table">
      <thead>
        <tr>
          <th>Username</th>
          <th>Credits</th>
        </tr>
      </thead>
      <tbody>
        {% for user in users %}
        <tr>
          <td>{{ user.username }}</td>
          <td>
            <div class="credits-row">
              <input
                class="credits-input"
                type="number"
                min="0"
                value="{{ user.credits }}"
                data-user-id="{{ user.id }}"
              />
              <button class="btn-save" onclick="saveCredits({{ user.id }}, this)">Save</button>
              <span class="save-status" id="status-{{ user.id }}"></span>
            </div>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
      <div class="empty-state">No users found.</div>
    {% endif %}
  </div>

  <script>
    const CSRF_TOKEN = "{{ session['csrf_token'] }}";
    async function saveCredits(userId, btn) {
      const input = btn.closest('.credits-row').querySelector('.credits-input');
      const status = document.getElementById('status-' + userId);
      const credits = parseInt(input.value, 10);
      if (isNaN(credits) || credits < 0) {
        status.textContent = 'Invalid value';
        status.className = 'save-status error visible';
        return;
      }
      btn.disabled = true;
      const res = await fetch('/admin/credits/' + userId, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-Token': CSRF_TOKEN
        },
        body: JSON.stringify({ credits })
      });
      btn.disabled = false;
      if (res.ok) {
        status.textContent = 'Saved';
        status.className = 'save-status visible';
      } else {
        const data = await res.json().catch(() => ({}));
        status.textContent = data.error || 'Error';
        status.className = 'save-status error visible';
      }
      setTimeout(() => { status.className = 'save-status'; }, 2000);
    }
  </script>
</body>
</html>
