<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="auth-layout">
  <div class="card">
    <h1>Create account</h1>
    <p>Register to get started</p>

    <form method="POST" action="/register">
      <label>
        Email
        <input
          type="email"
          name="username"
          placeholder="you@example.com"
          required
        />
      </label>

      <label>
        Password
        <input
          type="password"
          name="password"
          placeholder="••••••••"
          required
        />
      </label>
      <button type="submit">Register</button>
    </form>

    <p style="margin: 16px 0 0; font-size: 0.9rem;">Already have an account? <a href="/login" style="color: var(--accent); font-weight: 600; text-decoration: none;">Log In</a></p>
  </div>
</body>
</html>
